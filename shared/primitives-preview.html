<!doctype html>
<html><head><meta charset="utf-8"><title>ah-theme.js primitives</title>
<script src="ah-theme.js"></script>
<style>body{margin:0;padding:24px;background:#f5f6f7;font-family:var(--ah-font-ui, system-ui)}.wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}.bar{display:flex;gap:8px;margin-bottom:20px}</style>
</head><body>
<div class="bar ah-scope"><div class="ah-seg" style="width:180px" id="t"><button aria-pressed="true" data-v="soft">Soft</button><button data-v="dark">Dark</button></div><div class="ah-seg" style="width:200px" id="d"><button data-v="compact">Compact</button><button aria-pressed="true" data-v="roomy">Roomy</button></div></div>
<div class="wrap">
<div class="ah-panel ah-scope"><div class="ah-panel__header"><div class="ah-panel__title">Benchmarker</div><button class="ah-icon-btn ah-icon-btn--ghost ah-icon-btn--sm" aria-label="Minimise Benchmarker"><svg viewBox="0 0 24 24"><path d="M6 12h12"></path></svg></button></div>
<div class="ah-panel__body">
<div class="ah-section"><div class="ah-label" style="margin-bottom:8px">Current student</div><div style="font-weight:700;font-size:14px">Ava Nguyen</div><div class="ah-muted">Tue 10:00 · ATC205 | Design Journal</div></div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px"><button class="ah-grade-btn is-active" style="--ah-band:var(--ah-band-hd)">HD</button><button class="ah-grade-btn" style="--ah-band:var(--ah-band-d)">D</button><button class="ah-grade-btn" style="--ah-band:var(--ah-band-c)">C</button><button class="ah-grade-btn" style="--ah-band:var(--ah-band-p)">P</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="ah-btn ah-btn--primary">‹ Prev</button><button class="ah-btn ah-btn--primary">Next ›</button></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><div class="ah-stat ah-stat--primary ah-stat--auto"><div class="ah-stat__label">ETA</div><div class="ah-stat__value">9:28pm</div></div><div class="ah-stat ah-stat--auto"><div class="ah-stat__label">Done</div><div class="ah-stat__value">9</div></div><div class="ah-stat ah-stat--auto"><div class="ah-stat__label">Left</div><div class="ah-stat__value">15</div></div></div>
<details class="ah-details" open><summary>Student list</summary><div class="ah-row is-current"><span class="ah-dot" style="--ah-band:var(--ah-band-hd)"></span>Ava Nguyen<span class="ah-row__meta">HD</span></div><div class="ah-row"><span class="ah-dot" style="--ah-band:var(--ah-band-p)"></span>Ben Clarke<span class="ah-row__meta">Pass</span></div></details>
<details class="ah-details ah-details--divider"><summary>Save / import</summary><div style="display:flex;gap:6px"><button class="ah-btn ah-btn--sm">Export</button><button class="ah-btn ah-btn--sm ah-btn--ghost">Remove</button><button class="ah-btn ah-btn--sm ah-btn--danger">Reset</button></div></details>
</div></div>
<div class="ah-toast ah-scope"><div class="ah-spinner"></div>Finding the same student...</div>
</div>
<script>
const T=window.AssessmentHelpersTheme;
function sync(){const s=T.get();document.querySelectorAll('#t button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===s.theme));document.querySelectorAll('#d button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===s.density));}
document.querySelectorAll('#t button').forEach(b=>b.onclick=()=>T.set({theme:b.dataset.v}));
document.querySelectorAll('#d button').forEach(b=>b.onclick=()=>T.set({density:b.dataset.v}));
T.onChange(sync);sync();
</script>
</body></html>
